{% extends "_visual_base.html" %}
{% block title %}Editar concepto - LeSiCo{% endblock %}
{% block content %}
<h1>Editar concepto</h1>

    <p class="identifier">
        <strong>ID:</strong>
        {{ concepto["concept_id"] }}
    </p>

    <form class="compact-form"
        method="post"
        action="{{
            url_for(
                'concepts.actualizar_concepto',
                concept_id=concepto['concept_id']
            )
        }}"
    >
<input type="hidden" name="edit_token" value="{{ edit_token }}">

        <p>

            <label class="field">
                Etiqueta preferida:
            <input
                type="text"
                name="preferred_label"
                value="{{ concepto['preferred_label'] | human_concept_label }}"
                required
            ></label>

        </p>

        <button type="submit" class="button-primary">
            Guardar cambios
        </button>

    </form>

    <p>
        <a href="{{ url_for('concepts.conceptos') }}">
            Cancelar
        </a>
    </p>
{% endblock %}
