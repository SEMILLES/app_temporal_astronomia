<!doctype html><html lang="es"><meta charset="utf-8"><title>Nuevo conflicto</title><body><h1>Nuevo conflicto manual</h1>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post"><label>Descripción <textarea name="description" required>{{ form.description if form else '' }}</textarea></label><label>Subjects (uno por línea, tipo:id:rol) <textarea name="subjects" required>{{ form.subjects if form else '' }}</textarea></label><label><input type="radio" name="severity" value="blocking" required> Bloquea publicación</label><label><input type="radio" name="severity" value="non_blocking" required> NO bloquea publicación</label><label>Justificación de severidad <textarea name="justification" required></textarea></label><label>Criterio de resolución <textarea name="resolution_criteria" required></textarea></label><button>Crear conflicto</button></form></body></html>
