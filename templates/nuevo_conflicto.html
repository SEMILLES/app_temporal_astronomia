{% extends "_visual_base.html" %}
{% block title %}Nuevo conflicto{% endblock %}
{% block content %}
<h1>Nuevo conflicto manual</h1>{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" class="conflict-form">
<label class="field"><span>Descripción</span><textarea name="description" rows="4" required>{{ form.description if form else '' }}</textarea></label>
<fieldset><legend>Elementos afectados</legend>
{% for index in range(5) %}<div class="subject-row" {% if index>0 %}hidden{% endif %}>
<label class="field"><span>Tipo</span><select name="subject_type" class="subject-type" {% if index==0 %}required{% endif %}><option value="">Seleccione</option><option value="occurrence">Ocurrencia</option><option value="concept">Concepto</option><option value="alternative">Alternativa</option><option value="submission">Aporte</option><option value="alternative_relation">Relación</option></select></label>
<label class="field"><span>Elemento</span><select name="subject_id" class="subject-item" {% if index==0 %}required{% endif %}><option value="">Seleccione</option>{% for choice in choices %}<option value="{{ choice.id }}" data-subject-type="{{ choice.type }}">{{ choice.label }}</option>{% endfor %}</select></label>
</div>{% endfor %}
<button type="button" id="add-subject" class="button-secondary">+ Agregar otro elemento afectado</button></fieldset>
<fieldset class="field"><legend>¿Bloquea publicación?</legend><label><input type="radio" name="severity" value="blocking" required> Sí</label> <label><input type="radio" name="severity" value="non_blocking" required> No</label></fieldset>
<label class="field"><span>Justificación de esta clasificación</span><textarea name="justification" rows="3" required></textarea></label>
<label class="field"><span>Criterio de resolución</span><textarea name="resolution_criteria" rows="3" required></textarea></label>
<button class="button-secondary">Crear conflicto</button></form>
<script>document.addEventListener('DOMContentLoaded',()=>{const rows=[...document.querySelectorAll('.subject-row')];function filter(row){const type=row.querySelector('.subject-type').value;const item=row.querySelector('.subject-item');[...item.options].forEach(o=>o.hidden=!!o.dataset.subjectType&&o.dataset.subjectType!==type);if(item.selectedOptions[0]?.hidden)item.value=''}rows.forEach(r=>r.querySelector('.subject-type').addEventListener('change',()=>filter(r)));document.getElementById('add-subject').addEventListener('click',()=>{const row=rows.find(r=>r.hidden);if(row){row.hidden=false;row.querySelector('.subject-type').required=true;row.querySelector('.subject-item').required=true}})});</script>
{% endblock %}
