<!doctype html><html lang="es"><meta charset="utf-8"><title>Catálogo interno</title><body>{% include '_catalog_banner.html' %}<h1>Catálogo interno</h1><form method="get"><label>Buscar <input name="q" value="{{ query }}" placeholder="Concepto, alternativa o glosa"></label><button>Buscar</button></form><ul>{% for concept in concepts %}<li><a href="{{ url_for('catalog.internal_concept',concept_id=concept.concept_id) }}">{{ concept.preferred_label }}</a> — {{ concept.alternative_count }} alternativas · {{ concept.occurrence_count }} ocurrencias</li>{% else %}<li>No hay resultados.</li>{% endfor %}</ul></body></html>
