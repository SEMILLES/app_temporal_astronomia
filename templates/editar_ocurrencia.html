<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar ocurrencia - LeSiCo</title>
</head>

<body>

    <h1>Editar ocurrencia</h1>

    <p>
        <strong>ID:</strong>
        {{ ocurrencia["occurrence_id"] }}
    </p>

    <form
        method="post"
        action="{{
            url_for(
                'occurrences.actualizar_ocurrencia',
                occurrence_id=ocurrencia['occurrence_id']
            )
        }}"
    >

        <p>

            <label>
                Fuente:
            </label>

            <select
                name="source_id"
                required
            >

                {% for fuente in fuentes %}

                    <option
                        value="{{ fuente['source_id'] }}"
                        data-min-year="{{ fuente['start_year'] or '' }}"
                        data-max-year="{{ fuente['end_year'] or '' }}"

                        {% if fuente["source_id"] == ocurrencia["source_id"] %}
                            selected
                        {% endif %}
                    >
                        {{ fuente["source_name"] }}
                    </option>

                {% endfor %}

            </select>

        </p>


        <p>

            <label>
                Glosa original:
            </label>

            <input
                type="text"
                name="original_gloss"
                value="{{ ocurrencia['original_gloss'] or '' }}"
            >

        </p>


        <p>

            <label>
                Enlace:
            </label>

            <input
                type="url"
                name="hyperlink"
                value="{{ ocurrencia['hyperlink'] or '' }}"
            >

        </p>

        <p>
            <label>Localización en la fuente:</label>
            <input
                type="text"
                name="source_locator"
                value="{{ ocurrencia['source_locator'] or '' }}"
            >
        </p>

        <p>
            <label>Año de la ocurrencia (opcional):</label>
            <input
                type="number"
                name="occurrence_year"
                value="{{ ocurrencia['occurrence_year'] or '' }}"
                min="1"
                max="9999"
            >
        </p>

        <p>
            <label>Nota de procedencia:</label>
            <textarea name="provenance_note">{{ ocurrencia['provenance_note'] or '' }}</textarea>
        </p>

        <p>
            <label>Nota del cambio:</label>
            <textarea name="change_note"></textarea>
        </p>


        <button type="submit">
            Guardar cambios
        </button>

    </form>


    <p>
        <a href="{{ url_for('occurrences.clasificar_ocurrencia', occurrence_id=ocurrencia['occurrence_id']) }}">
            Clasificar ocurrencia
        </a>
    </p>

    <p>
        <a href="{{ url_for('occurrences.ocurrencias') }}">
            Cancelar
        </a>
    </p>

<script>(function(){const source=document.querySelector('[name=source_id]'),year=document.querySelector('[name=occurrence_year]');function limits(){const option=source.options[source.selectedIndex];year.min=option&&option.dataset.minYear||'1';year.max=option&&option.dataset.maxYear||'9999'}source.addEventListener('change',limits);limits()})();</script>
</body>

</html>
