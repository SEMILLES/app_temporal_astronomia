<!doctype html><html lang="es"><meta charset="utf-8"><title>Editar ocurrencia - LeSiCo</title><body>
<h1>Editar ocurrencia</h1><p><strong>ID:</strong> {{ ocurrencia['occurrence_id'] }}</p>
<form method="post" action="{{ url_for('occurrences.actualizar_ocurrencia',occurrence_id=ocurrencia['occurrence_id']) }}">
<p><label>Fuente: <select name="source_id" required>{% for fuente in fuentes %}<option value="{{ fuente['source_id'] }}" data-source-type="{{ fuente['source_type'] }}" data-min-year="{{ fuente['start_year'] or '' }}" data-max-year="{{ fuente['end_year'] or '' }}"{% if fuente['source_id']==ocurrencia['source_id'] %} selected{% endif %}>{{ fuente['source_name'] }}</option>{% endfor %}</select></label></p>
<p><label>Glosa original: <input name="original_gloss" value="{{ ocurrencia['original_gloss'] or '' }}"></label></p>
{% set draft=ocurrencia %}{% include '_source_details_form.html' %}
<p><label>Año de la ocurrencia: <input type="number" name="occurrence_year" value="{{ ocurrencia['occurrence_year'] or '' }}" min="1" max="9999"></label></p>
<fieldset><legend>Información documentada en la fuente</legend>
<p><label>Ejemplos de uso <select name="usage_examples_present"><option value="0"{% if not ocurrencia['usage_examples_present'] %} selected{% endif %}>No</option><option value="1"{% if ocurrencia['usage_examples_present'] %} selected{% endif %}>Sí</option></select></label></p>
<p><label>Información gramatical en la fuente <select name="grammatical_info_present"><option value="0"{% if not ocurrencia['grammatical_info_present'] %} selected{% endif %}>No</option><option value="1"{% if ocurrencia['grammatical_info_present'] %} selected{% endif %}>Sí</option></select></label></p>
<p id="grammatical-note-field"{% if not ocurrencia['grammatical_info_present'] %} hidden{% endif %}><label>Apunte gramatical <textarea name="grammatical_note">{{ ocurrencia['grammatical_note'] or '' }}</textarea></label></p>
</fieldset>
<p><label>Nota de procedencia: <textarea name="provenance_note">{{ ocurrencia['provenance_note'] or '' }}</textarea></label></p>
<p><label>Nota del cambio: <textarea name="change_note"></textarea></label></p>
<p><button type="submit">Guardar cambios</button></p>
</form>
<p><a href="{{ url_for('occurrences.clasificar_ocurrencia',occurrence_id=ocurrencia['occurrence_id']) }}"><strong>Clasificar ocurrencia</strong></a></p>
<p><small><a href="{{ url_for('occurrences.ocurrencias') }}">Cancelar</a></small></p>
<script>(function(){const source=document.querySelector('[name=source_id]'),year=document.querySelector('[name=occurrence_year]'),grammar=document.querySelector('[name=grammatical_info_present]'),note=document.getElementById('grammatical-note-field');function limits(){const option=source.options[source.selectedIndex];year.min=option&&option.dataset.minYear||'1';year.max=option&&option.dataset.maxYear||'9999'}function grammarNote(){note.hidden=grammar.value!=='1';if(note.hidden)note.querySelector('textarea').value=''}source.addEventListener('change',limits);grammar.addEventListener('change',grammarNote);limits();grammarNote()})();</script>
</body></html>
