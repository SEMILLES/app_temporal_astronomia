<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar ocurrencia - LeSiCo</title>
</head>

<body>

    <h1>Editar ocurrencia</h1>

    <p>
        <strong>ID:</strong>
        {{ ocurrencia["occurrence_id"] }}
    </p>

    <form
        method="post"
        action="{{
            url_for(
                'occurrences.actualizar_ocurrencia',
                occurrence_id=ocurrencia['occurrence_id']
            )
        }}"
    >

        <p>

            <label>
                Concepto:
            </label>

            <select
                name="concept_id"
                required
            >

                {% for concepto in conceptos %}

                    <option
                        value="{{ concepto['concept_id'] }}"

                        {% if concepto["concept_id"] == ocurrencia["concept_id"] %}
                            selected
                        {% endif %}
                    >
                        {{ concepto["preferred_label"] }}
                    </option>

                {% endfor %}

            </select>

        </p>


        <p>

            <label>
                Fuente:
            </label>

            <select
                name="source_id"
                required
            >

                {% for fuente in fuentes %}

                    <option
                        value="{{ fuente['source_id'] }}"

                        {% if fuente["source_id"] == ocurrencia["source_id"] %}
                            selected
                        {% endif %}
                    >
                        {{ fuente["source_name"] }}
                    </option>

                {% endfor %}

            </select>

        </p>


        <p>

            <label>
                Glosa original:
            </label>

            <input
                type="text"
                name="original_gloss"
                value="{{ ocurrencia['original_gloss'] or '' }}"
            >

        </p>


        <p>

            <label>
                Enlace:
            </label>

            <input
                type="url"
                name="hyperlink"
                value="{{ ocurrencia['hyperlink'] or '' }}"
            >

        </p>


        <button type="submit">
            Guardar cambios
        </button>

    </form>


    <p>
        <a href="{{ url_for('occurrences.ocurrencias') }}">
            Cancelar
        </a>
    </p>

</body>

</html>
