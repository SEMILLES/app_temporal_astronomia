<aside id="lesico-internal-context" data-access-role="{{ role }}">
<label>Trabajando como: <select id="lesico-collaborator"><option value="">Sin identificar</option>{% for collaborator in collaborators %}<option value="{{ collaborator[0] }}">{{ collaborator[1] }}</option>{% endfor %}</select></label>
<nav aria-label="Navegación interna">
<section><strong>ANÁLISIS</strong> <a href="{{ root }}/trabajo">Inicio</a> <a href="{{ root }}/ocurrencias">Ocurrencias</a> <a href="{{ root }}/borradores">Borradores</a> <a href="{{ root }}/conceptos">Conceptos / Alternativas</a> <a href="{{ root }}/aportes">Aportes</a></section>
<section><strong>CATÁLOGO</strong> <a href="{{ root }}/catalogo-interno" target="_blank" rel="noopener">Catálogo interno</a></section>
{% if show_review %}<section><strong>REVISIÓN</strong> <a href="{{ root }}/aportes/pendientes">Aportes pendientes</a> <a href="{{ root }}/conflictos">Conflictos</a></section>{% endif %}
{% if show_admin %}<section><strong>ADMINISTRACIÓN</strong> <a href="{{ root }}/colaboradores">Colaboradores</a> <a href="{{ root }}/actualizar-catalogo">Actualizar catálogo</a> <a href="{{ root }}/publicaciones">Publicaciones</a></section>{% endif %}
</nav></aside>
<script>document.addEventListener('DOMContentLoaded',function(){const key='lesico-collaborator-id';const s=document.getElementById('lesico-collaborator');const saved=localStorage.getItem(key)||'';if([...s.options].some(o=>o.value===saved))s.value=saved;else localStorage.removeItem(key);s.addEventListener('change',()=>localStorage.setItem(key,s.value));document.querySelectorAll('form[method="post"],form[method="POST"]').forEach(f=>{let i=f.querySelector('input[name="collaborator_id"]');if(!i){i=document.createElement('input');i.type='hidden';i.name='collaborator_id';f.appendChild(i)}f.addEventListener('submit',()=>i.value=s.value);i.value=s.value})});</script>
