<fieldset class="source-field-group"><legend>Identificación de la fuente</legend><div class="form-grid">
<label class="field">
            Nombre de la fuente:
        <input
            type="text"
            name="source_name"
            list="existing-source-names"
            required
        ></label>
<label class="field">Tipo de fuente:<select name="source_type" required><option value="">Seleccione</option>{% for value,label in source_types.items() %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
<label class="field">Referencia (opcional):<input type="text" name="source_reference"></label>
<label class="field">Código legacy (opcional):<input type="text" name="legacy_source_code"></label>
<datalist id="existing-source-names">{% for fuente in fuentes %}<option value="{{ fuente['source_name'] }}">{% endfor %}</datalist>
<small>Revise las coincidencias sugeridas antes de crear una fuente nueva.</small>
</div></fieldset>
<fieldset class="source-field-group"><legend>Alcance y formato</legend><div class="form-grid">
<label class="field">Alcance (opcional):<select name="source_scope">
            <option value="">Sin especificar</option>
            <option value="INSTITUTIONAL">Institucional</option>
            <option value="PERSONAL">Personal</option>
        </select></label>
<label class="field">Formato original (opcional):<input type="text" name="format_original"></label>
<label class="field">Detalle del formato (opcional):<input type="text" name="format_detail"></label>
</div></fieldset>
<fieldset class="source-field-group"><legend>Periodo de la fuente</legend><div class="form-grid">
<label class="field">Año inicial:<input type="number" name="start_year" min="1" max="9999"></label>
<label class="field">Año final:<input type="number" name="end_year" min="1" max="9999"></label>
<label class="field">Estado del año final:<select name="end_year_status">
            <option value="">Sin especificar</option>
            <option value="known">Conocido</option>
            <option value="ongoing">En curso</option>
            <option value="unknown">Desconocido</option>
        </select></label>
</div></fieldset>
<fieldset class="source-field-group"><legend>Descripción y contenido</legend><div class="form-grid">
<label class="field">Región (opcional):<textarea name="region_description"></textarea></label>
<label class="field">Caracterización (opcional):<textarea name="characterization"></textarea></label>
<label class="field">Número de entradas declarado (opcional):<input type="number" name="reported_entry_count" min="0"></label>
</div></fieldset>
