<!doctype html><html lang="es"><meta charset="utf-8"><title>Borradores</title><body>
<h1>Borradores de evidencia</h1>{% if drafts %}<ul>{% for draft in drafts %}<li>#{{ draft['draft_id'] }} — {{ draft['source_name'] or 'Sin fuente' }} — {{ draft['original_gloss'] or 'Sin glosa' }} <a href="{{ url_for('submissions.editar_borrador', draft_id=draft['draft_id']) }}">Continuar</a><form method="post" action="{{ url_for('submissions.eliminar_borrador', draft_id=draft['draft_id']) }}" style="display:inline"><button>Eliminar</button></form></li>{% endfor %}</ul>{% else %}<p>No hay borradores.</p>{% endif %}<a href="{{ url_for('submissions.nuevo_aporte') }}">Nuevo registro</a></body></html>
