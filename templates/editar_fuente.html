<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar fuente - LeSiCo</title>
</head>

<body>

    <h1>Editar fuente</h1>

    <p>
        <strong>ID:</strong>
        {{ fuente["source_id"] }}
    </p>

    <form
        method="post"
        action="{{
            url_for(
                'sources.actualizar_fuente',
                source_id=fuente['source_id']
            )
        }}"
    >

        <p>

            <label>
                Nombre:
            </label>

            <input
                type="text"
                name="source_name"
                value="{{ fuente['source_name'] }}"
                required
            >

        </p>

        <p>
            <label>Código legacy (opcional):</label>
            <input type="text" name="legacy_source_code" value="{{ fuente['legacy_source_code'] or '' }}">
        </p>
        <p><label>Tipo de fuente: <select name="source_type" required>{% for value,label in source_types.items() %}<option value="{{ value }}"{% if fuente['source_type']==value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label></p>
        {% if occurrence_count %}<p role="note"><strong>Advertencia:</strong> esta Source tiene {{ occurrence_count }} occurrences. Cambiar el tipo no reinterpretará ni borrará sus detalles guardados.</p>{% endif %}
        <p><label>Referencia (opcional): <input name="source_reference" value="{{ fuente['source_reference'] or '' }}"></label></p>
        <p>
            <label>Alcance (opcional):</label>
            <select name="source_scope">
                <option value="" {% if not fuente['source_scope'] %}selected{% endif %}>Sin especificar</option>
                <option value="INSTITUTIONAL" {% if fuente['source_scope'] == 'INSTITUTIONAL' %}selected{% endif %}>Institucional</option>
                <option value="PERSONAL" {% if fuente['source_scope'] == 'PERSONAL' %}selected{% endif %}>Personal</option>
            </select>
        </p>
        <p>
            <label>Formato original (opcional):</label>
            <input type="text" name="format_original" value="{{ fuente['format_original'] or '' }}">
        </p>
        <p>
            <label>Detalle del formato (opcional):</label>
            <input type="text" name="format_detail" value="{{ fuente['format_detail'] or '' }}">
        </p>
        <p>
            <label>Región (opcional):</label>
            <textarea name="region_description">{{ fuente['region_description'] or '' }}</textarea>
        </p>
        <p>
            <label>Caracterización (opcional):</label>
            <textarea name="characterization">{{ fuente['characterization'] or '' }}</textarea>
        </p>
        <p>
            <label>Número de entradas declarado (opcional):</label>
            <input type="number" name="reported_entry_count" value="{{ fuente['reported_entry_count'] if fuente['reported_entry_count'] is not none else '' }}" min="0">
        </p>
        <p>
            <label>Año inicial:</label>
            <input type="number" name="start_year" value="{{ fuente['start_year'] or '' }}">
        </p>
        <p>
            <label>Año final:</label>
            <input type="number" name="end_year" value="{{ fuente['end_year'] or '' }}">
        </p>
        <p>
            <label>Estado del año final:</label>
            <select name="end_year_status">
                <option value="" {% if not fuente['end_year_status'] %}selected{% endif %}>Sin especificar</option>
                <option value="known" {% if fuente['end_year_status'] == 'known' %}selected{% endif %}>Conocido</option>
                <option value="ongoing" {% if fuente['end_year_status'] == 'ongoing' %}selected{% endif %}>En curso</option>
                <option value="unknown" {% if fuente['end_year_status'] == 'unknown' %}selected{% endif %}>Desconocido</option>
            </select>
        </p>
        <p>
            <label>Nota del cambio:</label>
            <textarea name="change_note"></textarea>
        </p>

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <p>
        <a href="{{ url_for('sources.fuentes') }}">
            Cancelar
        </a>
    </p>

</body>

</html>
