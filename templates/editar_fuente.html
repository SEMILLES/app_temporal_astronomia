<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar fuente - LeSiCo</title>
</head>

<body>

    <h1>Editar fuente</h1>

    <p>
        <strong>ID:</strong>
        {{ fuente["source_id"] }}
    </p>

    <form
        method="post"
        action="{{
            url_for(
                'sources.actualizar_fuente',
                source_id=fuente['source_id']
            )
        }}"
    >

        <p>

            <label>
                Nombre:
            </label>

            <input
                type="text"
                name="source_name"
                value="{{ fuente['source_name'] }}"
                required
            >

        </p>

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <p>
        <a href="{{ url_for('sources.fuentes') }}">
            Cancelar
        </a>
    </p>

</body>

</html>
