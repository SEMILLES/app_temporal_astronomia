{% extends "_visual_base.html" %}
{% block title %}Colaboradores{% endblock %}
{% block content %}
<h1>Colaboradores</h1>
<form method="post"><label>Nombre <input name="display_name" required></label><button class="button-primary">Añadir</button></form>
<ul class="record-list">{% for collaborator in collaborators %}<li><form method="post" action="{{ url_for('collaborators.rename_collaborator',collaborator_id=collaborator['collaborator_id']) }}"><input aria-label="Nombre del colaborador {{ collaborator['collaborator_id'] }}" name="display_name" value="{{ collaborator['display_name'] }}" required><button class="button-secondary">Editar nombre</button></form></li>{% else %}<li>No hay colaboradores registrados.</li>{% endfor %}</ul>
{% endblock %}
