<fieldset id="source-details" data-prefill-video-id="{{ 'true' if not draft else 'false' }}"><legend>Referencia dentro de la fuente</legend>
{% for number in (1,2) %}{% set status_name='source_detail_' ~ number ~ '_status' %}{% set value_name='source_detail_' ~ number %}<p class="source-detail" data-detail="{{ number }}"><label><span class="detail-label">Detalle Fuente {{ number }}</span> <input name="{{ value_name }}" value="{{ draft[value_name] if draft and draft[value_name] else '' }}"></label> <label>Estado <select name="{{ status_name }}"><option value="VALUE"{% if draft and draft[status_name]=='VALUE' %} selected{% endif %}>Dato</option><option value="NA"{% if draft and draft[status_name]=='NA' %} selected{% endif %}>N/A</option><option value="UNKNOWN"{% if not draft or draft[status_name]=='UNKNOWN' %} selected{% endif %}>Desconocido</option></select></label></p>{% endfor %}
</fieldset>
<script src="{{ url_for('static',filename='source-details.js') }}"></script>
