<!doctype html><html lang="es"><meta charset="utf-8"><title>{{ concept.preferred_label }}</title><body>{% include '_external_version.html' %}<p><a href="{{ url_for('catalog.external_version',version_number=publication.version_number) if historical else url_for('catalog.external_catalog') }}">Catálogo público</a></p><h1>{{ concept.preferred_label }}</h1>
{% for alternative in concept.alternatives %}<article><h2><a href="{{ url_for('catalog.external_version_alternative',version_number=publication.version_number,alternative_id=alternative.alternative_id) if historical else url_for('catalog.external_alternative',alternative_id=alternative.alternative_id) }}">{{ alternative.name }}</a></h2><p>{{ alternative.occurrences|length }} ocurrencias.</p></article>{% endfor %}</body></html>
