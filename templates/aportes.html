<!doctype html><html lang="es"><meta charset="utf-8"><title>Aportes</title><body><h1>Aportes</h1><table border="1"><tr><th>ID</th><th>Tipo</th><th>Occurrence</th><th>Fuente</th><th>Estado</th><th>Resolución</th></tr>{% for aporte in aportes %}<tr><td>{{ aporte['submission_id'] }}</td><td>{{ aporte['submission_type'] }}</td><td>{{ aporte['original_gloss'] }}</td><td>{{ aporte['source_name'] }}</td><td>{{ aporte['status'] }}</td><td>{{ aporte['resolution'] or '—' }}</td></tr>{% endfor %}</table><a href="{{ url_for('submissions.nuevo_aporte') }}">Registrar occurrence</a></body></html>
